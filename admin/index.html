<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Admin Login — iQPlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0e0f11;color:#f9f9f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background-image:radial-gradient(700px 320px at 85% -60px,rgba(238,9,121,.13),transparent 60%),radial-gradient(600px 300px at -10% 110%,rgba(255,106,0,.1),transparent 60%)}
.card{width:100%;max-width:392px;background:#17181c;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:32px 27px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#ee0979,#ff6a00);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;margin:0 auto 15px}
h1{text-align:center;font-size:21px}
h1 b{background:linear-gradient(90deg,#ee0979,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{text-align:center;color:#9a9da3;font-size:13px;margin:7px 0 23px;line-height:1.55}
label{display:block;font-size:12.3px;color:#9a9da3;margin:0 0 6px 2px;font-weight:650}
input{width:100%;background:#101114;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:#f9f9f9;font-size:14px;outline:none;margin-bottom:14px}
input:focus{border-color:#ee0979}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#9a9da3;margin:2px 0 19px}
.row label{display:flex;gap:7px;align-items:center;margin:0;cursor:pointer;font-weight:500}
.row input{width:auto;margin:0}
.row a{color:#ff8fc0;text-decoration:none}
button{width:100%;border:none;cursor:pointer;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ee0979,#ff6a00)}
.note{text-align:center;color:#6d7079;font-size:12px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<form class='card' id='loginForm'>
  <div class='logo'>iQ</div>
  <h1>iQPlay <b>Admin</b></h1>
  <p class='sub'>Sign in to manage your website.<br>Static demo — any email &amp; password will work.</p>
  <label>Email</label>
  <input type='email' placeholder='admin@iqplay.site' autocomplete='username'>
  <label>Password</label>
  <input type='password' placeholder='••••••••••' autocomplete='current-password'>
  <div class='row'><label><input type='checkbox' checked> Remember me</label><a href='#'>Forgot password?</a></div>
  <button type='submit'>Sign In →</button>
  <p class='note'>Protected area · iQPlay administration<br>Bots sign in with API keys instead — see API Access.</p>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  try { localStorage.setItem('iqplay_admin_logged', '1'); } catch(err){}
  location.href = 'admin.html';
});
</script>
</body>
</html>
